# NOTE on env_file: a service-level key REPLACES the same key merged in from
# an anchor (lists are not concatenated). So env_file is NOT in x-shark-common;
# every service lists its own files. For monitors, later files win, so
# stations/<name>.env overrides .env.
# There is no container_name anywhere, so a second stack started with
# `docker compose -p <project> up -d` cannot collide with production.
x-shark-common: &shark-common
  build: .
  restart: unless-stopped
  network_mode: host

x-monitor-healthcheck: &monitor-healthcheck
  test: ["CMD", "python", "-c", "import os, time; p = os.path.join(os.getenv('STATE_DIR', '.'), '.monitor_state'); exit(0 if os.path.exists(p) and os.path.getmtime(p) > time.time() - 120 else 1)"]
  interval: 2m
  timeout: 10s
  retries: 3
  start_period: 30s

services:
  monitor-radiospiral:
    <<: *shark-common
    command: python monitor_stream.py
    env_file: [.env, stations/radiospiral.env]
    volumes:
      - ./state/radiospiral:/state
    healthcheck: *monitor-healthcheck

  monitor-pulse:
    <<: *shark-common
    command: python monitor_stream.py
    env_file: [.env, stations/pulse.env]
    volumes:
      - ./state/pulse:/state
    healthcheck: *monitor-healthcheck

  monitor-inner:
    <<: *shark-common
    command: python monitor_stream.py
    env_file: [.env, stations/inner.env]
    volumes:
      - ./state/inner:/state
    healthcheck: *monitor-healthcheck

  monitor-outer:
    <<: *shark-common
    command: python monitor_stream.py
    env_file: [.env, stations/outer.env]
    volumes:
      - ./state/outer:/state
    healthcheck: *monitor-healthcheck

  bot:
    <<: *shark-common
    command: python grace_period_bot.py
    env_file: [.env]
    volumes:
      - ./state:/state
      - ./stations.json:/app/stations.json:ro
    depends_on:
      - monitor-radiospiral
      - monitor-pulse
      - monitor-inner
      - monitor-outer
    healthcheck:
      test: ["CMD", "pgrep", "-f", "grace_period_bot.py"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s
